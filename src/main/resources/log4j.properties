# 全局使用 INFO，Mapper 单独输出 DEBUG 级 SQL 日志。
log4j.rootLogger=INFO, labTrace

log4j.appender.labTrace=org.apache.log4j.ConsoleAppender
log4j.appender.labTrace.Target=System.out
log4j.appender.labTrace.Encoding=UTF-8
log4j.appender.labTrace.layout=org.apache.log4j.PatternLayout
log4j.appender.labTrace.layout.ConversionPattern=%d{HH:mm:ss.SSS} | %-5p | %c{1} | %m%n

log4j.logger.cn.edu.course.mybatis.mapper=DEBUG
